<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0b2e">
    <link rel="apple-touch-icon" href="assets/icon.png">
    
    <title>منصة رندة VIP - الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* تأثيرات الخلفية الفخمة */
        .bg-glow {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        
        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 800px;
            z-index: 1;
            padding-top: 40px;
            padding-bottom: 50px;
        }

        /* هيدر الـ VIP */
        .header-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .header-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }

        .vip-badge {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--gold-glow);
            text-transform: uppercase;
        }

        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            padding: 3px;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            object-fit: cover;
            background: #fff;
        }

        .header-glass h1 { margin: 0; font-size: 2.2rem; font-weight: 900; background: linear-gradient(to right, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-glass p { margin: 10px 0 0; color: var(--text-muted); font-size: 1.1rem; }

        /* شبكة المواد */
        .section-title {
            font-size: 1.3rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        /* كروت المواد الفخمة */
        .subject-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .subject-card:hover, .subject-card:active {
            transform: translateY(-5px);
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(251, 191, 36, 0.1);
        }

        .subject-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 3px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform 0.3s;
        }
        
        .subject-card.active::after { transform: scaleX(1); }
        .subject-card:hover::after { transform: scaleX(1); }

        .icon-wrap {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .title { font-weight: bold; font-size: 1.2rem; display: block; margin-bottom: 5px;}
        .subtitle { font-size: 0.85rem; color: var(--text-muted); }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 15px;
            margin-top: 30px;
            border: 1px solid var(--glass-border);
        }

        .stat-item { text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--gold); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); }

    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        
        <!-- الهيدر الفخم -->
        <div class="header-glass">
            <span class="vip-badge">VIP Student</span>
            <!-- مكان اللوجو اللي رح تعمله بالذكاء الاصطناعي -->
            <img src="assets/icon.png" alt="Randa Profile" class="profile-pic">
            
            <h1>أكاديمية رندة زربا</h1>
            <p>مدرسة الدوحة - الصف التاسع | منصة النخبة</p>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-val">1</div>
                    <div class="stat-label">المواد النشطة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">100%</div>
                    <div class="stat-label">معدل الإنجاز</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">🌟</div>
                    <div class="stat-label">طالبة متميزة</div>
                </div>
            </div>
        </div>

        <div class="section-title">
            <span>✨</span> مكتبة الدروس التفاعلية
        </div>
        
        <div class="grid">
            <!-- كرت اللغة العربية -->
            <a href="arabic_lesson1.html" class="subject-card active">
                <span class="icon-wrap">📖</span>
                <span class="title">اللغة العربية</span>
                <span class="subtitle">درس: العرش يزهو</span>
            </a>
            
            <a href="#" class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
                <span class="icon-wrap">🔬</span>
                <span class="title">العلوم</span>
                <span class="subtitle">يتم التجهيز...</span>
            </a>

            <a href="#" class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
                <span class="icon-wrap">📐</span>
                <span class="title">الرياضيات</span>
                <span class="subtitle">يتم التجهيز...</span>
            </a>

            <a href="#" class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
                <span class="icon-wrap">🌍</span>
                <span class="title">الاجتماعيات</span>
                <span class="subtitle">يتم التجهيز...</span>
            </a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ربط التطبيق بملف الـ Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4e54c8">
    <link rel="apple-touch-icon" href="assets/icon.png">
    
    <title>منصة رندة - الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        :root { --primary: #4e54c8; --secondary: #8f94fb; --bg: #f4f7f6; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); width: 100%; padding: 40px 20px 20px; text-align: center; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2rem; }
        .header p { margin: 10px 0 0; opacity: 0.9; }
        .container { width: 90%; max-width: 600px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .subject-card { background: white; border-radius: 20px; padding: 25px 15px; text-align: center; text-decoration: none; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.2s; border-bottom: 4px solid var(--primary); }
        .subject-card:active { transform: scale(0.95); }
        .icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        .title { font-weight: bold; font-size: 1.2rem; }
        
        /* زر التثبيت رح يظهر لحاله بس نبرمجه بالجافاسكربت إذا لزم، بس المتصفح بيطلعه غالباً من حاله */
    </style>
</head>
<body>

    <div class="header">
        <h1>أكاديمية رندة زربا</h1>
        <p>مدرسة الدوحة - الصف التاسع</p>
    </div>

    <div class="container">
        <h2 style="color: var(--primary); margin-bottom: 20px;">📚 دفاتري وملخصاتي:</h2>
        
        <div class="grid">
            <!-- رابط لدرس العربي اللي عملناه -->
            <a href="arabic_lesson1.html" class="subject-card" style="border-bottom-color: #ff6b6b;">
                <span class="icon">📖</span>
                <span class="title">اللغة العربية</span>
                <p style="margin:5px 0 0; font-size:0.85rem; color:#888;">درس: العرش يزهو</p>
            </a>
            
            <a href="#" class="subject-card" style="border-bottom-color: #20c997; opacity: 0.6;">
                <span class="icon">🔬</span>
                <span class="title">العلوم</span>
                <p style="margin:5px 0 0; font-size:0.85rem; color:#888;">(قريباً...)</p>
            </a>

            <a href="#" class="subject-card" style="border-bottom-color: #fca311; opacity: 0.6;">
                <span class="icon">📐</span>
                <span class="title">الرياضيات</span>
                <p style="margin:5px 0 0; font-size:0.85rem; color:#888;">(قريباً...)</p>
            </a>

            <a href="#" class="subject-card" style="border-bottom-color: #4361ee; opacity: 0.6;">
                <span class="icon">🌍</span>
                <span class="title">الاجتماعيات</span>
                <p style="margin:5px 0 0; font-size:0.85rem; color:#888;">(قريباً...)</p>
            </a>
        </div>
    </div>

    <script>
        // تسجيل الـ Service Worker عشان يشتغل كتطبيق
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Error', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درس: العرش يزهو | أكاديمية رندة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        :root { --bg-grad-1: #0f172a; --bg-grad-2: #1e1b4b; --gold: #fbbf24; --text-main: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2)); color: var(--text-main); min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(251, 191, 36, 0.3); }
        .back-btn { color: var(--gold); text-decoration: none; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .radar-btn { background: var(--gold); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-family: 'Tajawal', sans-serif; cursor: pointer; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); display: flex; align-items: center; gap: 8px; font-size: 1rem; transition: 0.3s; }
        .radar-btn:active { transform: scale(0.95); }
        
        .lesson-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; line-height: 2; font-size: 1.2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .lesson-title { color: var(--gold); margin-top: 0; text-align: center; font-size: 1.8rem; }
        
        /* Modals */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(10px); align-items: center; justify-content: center; flex-direction: column; }
        .modal.show { display: flex; }
        .glass-box { background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--gold); border-radius: 20px; padding: 25px; width: 90%; max-width: 500px; text-align: center; position: relative; max-height: 80vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 25px; color: var(--gold); font-size: 35px; font-weight: bold; cursor: pointer; }
        .result-text { text-align: right; line-height: 1.8; font-size: 1.1rem; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .loader { border: 4px solid rgba(251, 191, 36, 0.2); border-top: 4px solid var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
        <button class="radar-btn" onclick="launchLessonRadar()"><i class="fa-solid fa-crosshairs"></i> رادار الدرس</button>
    </div>

    <!-- هذا المربع يحتوي على نص الدرس الصافي فقط -->
    <div class="lesson-box" id="lessonTextContainer">
        <h2 class="lesson-title">العرش يزهو</h2>
        <p>
            (هنا نضع نص القصيدة أو التلخيص الخاص برندة لتدرسه)<br>
            مثال: يزهو بك العرش لا بل يزهو بك البلد...<br>
            وهذا النص هو ما سيقرأه الرادار الذكي فقط لاستخراج الأسئلة بمعزل عن أي شيء آخر في الموقع.
        </p>
    </div>

    <!-- نافذة التحميل -->
    <div id="loadingModal" class="modal">
        <div class="glass-box" style="background: transparent; border: none; box-shadow: none;">
            <div class="loader"></div>
            <h3 style="color: var(--gold);">جارٍ استخراج الأسئلة المتوقعة...</h3>
        </div>
    </div>

    <!-- نافذة النتيجة -->
    <div id="resultModal" class="modal">
        <div class="glass-box">
            <span class="close-btn" onclick="document.getElementById('resultModal').classList.remove('show')">&times;</span>
            <h2 style="color: var(--gold); margin-top: 0;"><i class="fa-solid fa-crosshairs"></i> توقعات الـ VIP</h2>
            <div id="resultBody" class="result-text"></div>
        </div>
    </div>

    <script>
        const MODEL_NAME = 'gemini-3.6-flash';
        
        async function launchLessonRadar() {
            const apiKey = localStorage.getItem('randa_gemini_key');
            if(!apiKey) { 
                alert('الرجاء العودة للرئيسية وتفعيل المفتاح من إعدادات VIP أولاً!'); 
                window.location.href = 'index.html';
                return; 
            }
            
            document.getElementById('loadingModal').classList.add('show');
            
            // قراءة نص الدرس الصافي فقط من المربع
            const lessonContent = document.getElementById('lessonTextContainer').innerText;
            
            const prompt = `أنت رادار امتحانات متطور لطالبة متميزة جداً في الصف التاسع اسمها رندة.
            هذا هو محتوى درسها:
            """${lessonContent}"""
            مهمتك:
            استخراج 3 أسئلة متوقعة بقوة من هذا المحتوى وتصنيفها كالتالي مع الحل:
            🔴 [سؤال وزاري حتمي]
            🟡 [كمين امتحاني / خدعة]
            🟢 [سؤال مضمون]
            رد بأسلوب مشجع وحماسي للملكة رندة بدون مقدمات طويلة، ورتب النص بـ HTML بسيط (استخدم <br> للأسطر، و <b> للخط العريض).`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-goog-api-key': apiKey },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                
                const resultText = data.candidates[0].content.parts[0].text;
                document.getElementById('resultBody').innerHTML = resultText;
                
                document.getElementById('loadingModal').classList.remove('show');
                document.getElementById('resultModal').classList.add('show');
            } catch (e) {
                document.getElementById('loadingModal').classList.remove('show');
                alert('حدث خطأ في الرادار: ' + e.message);
            }
        }
    </script>
</body>
</html>
